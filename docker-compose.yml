services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
    env_file:
      - ./ai-service/.env
    ports:
      - "8000:8000"
    depends_on:
      - mongo
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      PYTHON_SERVICE_URL: http://ai-service:8000
    depends_on:
      - ai-service
      - mongo
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    depends_on:
      - backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  mongo_data:
